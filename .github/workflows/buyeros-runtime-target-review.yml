name: BuyerOS private runtime-target review

# Diagnostic only: no build, deployment, database write, signoff or promotion.
on:
  workflow_dispatch:
    inputs:
      recipient_public_key:
        description: Backend-held RSA public PEM; keep private material off Actions
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: buyeros-private-runtime-target-review
  cancel-in-progress: false

jobs:
  review:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'YNWAforever/BuyerOS' &&
      github.actor_id == '201698560' &&
      github.run_attempt == 1
    environment: buyeros-runtime-readonly
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: python -m pip install uv==0.11.27
      - run: uv sync --frozen
        working-directory: services/api
      - name: Install bounded protected GET transport
        run: |
          npm install --global vercel@54.17.2
          npm install --prefix "$RUNNER_TEMP/buyeros-curl-cli" --no-audit --no-fund --package-lock=false vercel@50.28.0
          echo "BUYEROS_VERCEL_CURL_PACKAGE=$RUNNER_TEMP/buyeros-curl-cli/node_modules/vercel" >> "$GITHUB_ENV"
      - name: Encrypt credential-safe canonical diagnostics
        env:
          BUYEROS_REVIEW_RECIPIENT_PUBLIC_KEY: ${{ inputs.recipient_public_key }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          BUYEROS_RELEASE_PROBE_TOKEN: ${{ secrets.BUYEROS_RELEASE_PROBE_TOKEN }}
          BUYEROS_G0_TARGET_JSON: ${{ secrets.BUYEROS_G0_TARGET_JSON }}
          BUYEROS_SCHEMA_CONTRACT_JSON: ${{ secrets.BUYEROS_SCHEMA_CONTRACT_JSON }}
          BUYEROS_SCHEMA_CHECK_DATABASE_URL: ${{ secrets.BUYEROS_SCHEMA_CHECK_DATABASE_URL }}
          BUYEROS_G0_OWNED_TOKEN: ${{ secrets.BUYEROS_G0_OWNED_TOKEN }}
          BUYEROS_G0_FOREIGN_TOKEN: ${{ secrets.BUYEROS_G0_FOREIGN_TOKEN }}
          BUYEROS_G0_EMPTY_TOKEN: ${{ secrets.BUYEROS_G0_EMPTY_TOKEN }}
          BUYEROS_G0_REVOKED_TOKEN: ${{ secrets.BUYEROS_G0_REVOKED_TOKEN }}
        run: services/api/.venv/bin/python scripts/review-runtime-target.py --output "$RUNNER_TEMP/buyeros-runtime-target-review.encrypted.json"
      - name: Upload only encrypted diagnostic metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: buyeros-private-runtime-target-review-encrypted
          path: ${{ runner.temp }}/buyeros-runtime-target-review.encrypted.json
          if-no-files-found: error
          retention-days: 1
