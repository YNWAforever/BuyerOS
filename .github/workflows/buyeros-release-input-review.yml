name: BuyerOS private release-input review

# Review metadata only. No release, secret mutation or acceptance can run here.
on:
  workflow_dispatch:
    inputs:
      recipient_public_key:
        description: Ephemeral RSA public PEM (2048–4096 bits); keep its private key off Actions
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: buyeros-private-release-input-review
  cancel-in-progress: false

jobs:
  review:
    # A fresh owner dispatch is required; a rerun cannot inherit owner authority.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'YNWAforever/BuyerOS' &&
      github.actor_id == '201698560' &&
      github.run_attempt == 1
    environment: buyeros-runtime-readonly
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The main-only dispatch SHA avoids a moving-main checkout race.
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.11.27
      - run: uv sync --frozen
        working-directory: services/api
      - name: Encrypt validated seeds for owner review only
        env:
          BUYEROS_REVIEW_RECIPIENT_PUBLIC_KEY: ${{ inputs.recipient_public_key }}
          BUYEROS_G0_TARGET_JSON: ${{ secrets.BUYEROS_G0_TARGET_JSON }}
          BUYEROS_SCHEMA_CONTRACT_JSON: ${{ secrets.BUYEROS_SCHEMA_CONTRACT_JSON }}
          BUYEROS_SCHEMA_CHECK_DATABASE_URL: ${{ secrets.BUYEROS_SCHEMA_CHECK_DATABASE_URL }}
          BUYEROS_G0_OWNED_TOKEN: ${{ secrets.BUYEROS_G0_OWNED_TOKEN }}
          BUYEROS_G0_FOREIGN_TOKEN: ${{ secrets.BUYEROS_G0_FOREIGN_TOKEN }}
          BUYEROS_G0_EMPTY_TOKEN: ${{ secrets.BUYEROS_G0_EMPTY_TOKEN }}
          BUYEROS_G0_REVOKED_TOKEN: ${{ secrets.BUYEROS_G0_REVOKED_TOKEN }}
        run: services/api/.venv/bin/python scripts/prepare-release-input-review.py --output "$RUNNER_TEMP/buyeros-release-input-review.encrypted.json"
      - name: Upload only encrypted review metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: buyeros-private-release-input-review-encrypted
          path: ${{ runner.temp }}/buyeros-release-input-review.encrypted.json
          if-no-files-found: error
          retention-days: 1
