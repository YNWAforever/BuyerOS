name: BuyerOS authenticated conversation QA

# Manual, protected, real-account acceptance for the conversation studio.
# Two ways to run it, both gated by the protected environment (and therefore by
# its required reviewers and secrets):
#   1. workflow_dispatch from any ref that carries this file (after merge: main).
#   2. adding the `qa:real` label to a pull request FROM THIS REPOSITORY. PRs from
#      forks never receive secrets, and the job refuses them explicitly.
# It is never triggered by a push, so ordinary CI cannot reach a real account.
on:
  workflow_dispatch:
    inputs:
      origin:
        description: HTTPS deployment origin to test (for example the branch preview URL)
        required: true
        type: string
      workspace_id:
        description: Dedicated QA workspace UUID
        required: true
        type: string
      project_id:
        description: Dedicated QA project UUID
        required: true
        type: string
      expected_source_sha:
        description: Full commit SHA the deployment must be built from
        required: true
        type: string
  pull_request:
    types: [labeled]

permissions:
  contents: read
  actions: read

concurrency:
  group: buyeros-conversation-qa-${{ github.event.pull_request.number || inputs.workspace_id || 'manual' }}
  cancel-in-progress: false

env:
  QA_ORIGIN: ${{ inputs.origin || vars.BUYEROS_QA_ORIGIN }}
  QA_WORKSPACE: ${{ inputs.workspace_id || vars.BUYEROS_QA_WORKSPACE_ID }}
  QA_PROJECT: ${{ inputs.project_id || vars.BUYEROS_QA_PROJECT_ID }}
  QA_SHA: ${{ inputs.expected_source_sha || github.event.pull_request.head.sha }}

jobs:
  conversation-qa:
    # A labeled PR may only run this when it comes from this repository.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'qa:real' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    # Secrets for the real QA account live only on this protected environment.
    # Configure required reviewers there so no run starts without an approval.
    environment: buyeros-conversation-qa
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify the target is the reviewed deployment
        env:
          QA_BYPASS: ${{ secrets.BUYEROS_QA_PROTECTION_BYPASS }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const {origin, workspace, project, sha} = {
            origin: process.env.QA_ORIGIN, workspace: process.env.QA_WORKSPACE,
            project: process.env.QA_PROJECT, sha: process.env.QA_SHA,
          };
          const fail = (message) => { console.error('BLOCKED: ' + message); process.exit(1) };
          if (!origin) fail('BUYEROS_QA_ORIGIN is not configured (input or repository variable)');
          let url;
          try { url = new URL(origin) } catch { fail('origin is not a URL') }
          if (url.protocol !== 'https:') fail('origin must be https');
          if (url.pathname !== '/' || url.search || url.hash || url.username || url.password)
            fail('origin must be a bare origin without path, query or credentials');
          // Credentials are only ever submitted to a Vercel-hosted candidate.
          if (!url.hostname.endsWith('.vercel.app') && url.hostname !== 'vercel.app')
            fail('origin must be a Vercel deployment host');
          const uuid = /^[0-9a-f]{8}-(?:[0-9a-f]{4}-){3}[0-9a-f]{12}$/i;
          if (!workspace) fail('QA workspace id is not configured');
          if (!uuid.test(workspace)) fail('workspace id is not a UUID');
          if (!project) fail('QA project id is not configured');
          if (!uuid.test(project)) fail('project id is not a UUID');
          if (!/^[0-9a-f]{40}$/.test(sha || '')) fail('expected source SHA must be a full 40-character SHA');
          const bypass = process.env.QA_BYPASS;
          if (bypass && (!/^\S+$/.test(bypass) || bypass.length < 20))
            fail('BUYEROS_QA_PROTECTION_BYPASS looks invalid (expected a single token of at least 20 characters)');
          console.log('target accepted: ' + url.origin + (bypass ? ' (with deployment-protection bypass)' : ''));
          NODE
      - name: Run the authenticated conversation QA journey
        env:
          BUYEROS_QA_ORIGIN: ${{ env.QA_ORIGIN }}
          BUYEROS_QA_WORKSPACE_ID: ${{ env.QA_WORKSPACE }}
          BUYEROS_QA_PROJECT_ID: ${{ env.QA_PROJECT }}
          BUYEROS_QA_EXPECTED_SOURCE_SHA: ${{ env.QA_SHA }}
          BUYEROS_NEON_REAL_EMAIL: ${{ secrets.BUYEROS_NEON_REAL_EMAIL }}
          BUYEROS_NEON_REAL_PASSWORD: ${{ secrets.BUYEROS_NEON_REAL_PASSWORD }}
          # Optional: only needed when the candidate is a protected preview.
          BUYEROS_QA_PROTECTION_BYPASS: ${{ secrets.BUYEROS_QA_PROTECTION_BYPASS }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/conversation-qa
          pnpm exec playwright test --config playwright.conversation-real.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: buyeros-conversation-qa
          path: artifacts/conversation-qa/
          if-no-files-found: warn
