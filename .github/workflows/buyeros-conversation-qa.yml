name: BuyerOS authenticated conversation QA

# Manual, protected, real-account acceptance for the conversation studio.
# It signs in to a deployed candidate with a real Neon account and exercises the
# conversation surface in the dedicated QA workspace. It is never triggered by a
# push or a pull request, so ordinary CI cannot reach a real account.
on:
  workflow_dispatch:
    inputs:
      origin:
        description: HTTPS deployment origin to test (for example the branch preview URL)
        required: true
        type: string
      workspace_id:
        description: Dedicated QA workspace UUID
        required: true
        type: string
      project_id:
        description: Dedicated QA project UUID
        required: true
        type: string
      expected_source_sha:
        description: Full commit SHA the deployment must be built from
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: buyeros-conversation-qa
  cancel-in-progress: false

jobs:
  conversation-qa:
    # Secrets for the real QA account live only on this protected environment.
    # Configure required reviewers there before the first run.
    environment: buyeros-conversation-qa
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify the target is the reviewed deployment
        env:
          ORIGIN: ${{ inputs.origin }}
          WORKSPACE_ID: ${{ inputs.workspace_id }}
          PROJECT_ID: ${{ inputs.project_id }}
          EXPECTED_SHA: ${{ inputs.expected_source_sha }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const {origin, workspace, project, sha} = {
            origin: process.env.ORIGIN, workspace: process.env.WORKSPACE_ID,
            project: process.env.PROJECT_ID, sha: process.env.EXPECTED_SHA,
          };
          const fail = (message) => { console.error('BLOCKED: ' + message); process.exit(1) };
          let url;
          try { url = new URL(origin) } catch { fail('origin is not a URL') }
          if (url.protocol !== 'https:') fail('origin must be https');
          if (url.pathname !== '/' || url.search || url.hash || url.username || url.password)
            fail('origin must be a bare origin without path, query or credentials');
          // Credentials are only ever submitted to a Vercel-hosted candidate.
          if (!url.hostname.endsWith('.vercel.app') && url.hostname !== 'vercel.app')
            fail('origin must be a Vercel deployment host');
          const uuid = /^[0-9a-f]{8}-(?:[0-9a-f]{4}-){3}[0-9a-f]{12}$/i;
          if (!uuid.test(workspace)) fail('workspace_id is not a UUID');
          if (!uuid.test(project)) fail('project_id is not a UUID');
          if (!/^[0-9a-f]{40}$/.test(sha)) fail('expected_source_sha must be a full 40-character SHA');
          console.log('target accepted: ' + url.origin);
          NODE
      - name: Confirm the deployment reports the reviewed source
        env:
          ORIGIN: ${{ inputs.origin }}
          EXPECTED_SHA: ${{ inputs.expected_source_sha }}
        run: |
          set -euo pipefail
          body="$(curl --fail --silent --show-error --max-time 30 --retry 3 --retry-delay 5 "$ORIGIN/healthz" || true)"
          if [ -z "$body" ]; then
            echo "no /healthz endpoint on this deployment; source binding is asserted by the QA spec instead"
          else
            echo "$body" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const v=JSON.parse(s);if(v&&v.source_sha&&v.source_sha!==process.env.EXPECTED_SHA){console.error('BLOCKED: deployment source mismatch');process.exit(1)}})"
          fi
      - name: Run the authenticated conversation QA journey
        env:
          BUYEROS_QA_ORIGIN: ${{ inputs.origin }}
          BUYEROS_QA_WORKSPACE_ID: ${{ inputs.workspace_id }}
          BUYEROS_QA_PROJECT_ID: ${{ inputs.project_id }}
          BUYEROS_QA_EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          BUYEROS_NEON_REAL_EMAIL: ${{ secrets.BUYEROS_NEON_REAL_EMAIL }}
          BUYEROS_NEON_REAL_PASSWORD: ${{ secrets.BUYEROS_NEON_REAL_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/conversation-qa
          pnpm exec playwright test --config playwright.conversation-real.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: buyeros-conversation-qa
          path: artifacts/conversation-qa/
          if-no-files-found: warn
