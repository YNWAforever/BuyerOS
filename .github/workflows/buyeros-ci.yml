name: BuyerOS CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  release-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.11.27
      - run: uv sync --frozen
        working-directory: services/api
      - name: Discover and execute all promotion refusal controls
        run: |
          mkdir -p artifacts/repair
          services/api/.venv/bin/python -m pytest tests/test_release_readiness.py tests/test_candidate_promotion.py tests/test_workspace_runtime_observations.py tests/test_runtime_observation_packet.py tests/test_runtime_observation_workflow.py --collect-only -q > artifacts/repair/promotion-discovery.txt
          services/api/.venv/bin/python -m pytest tests/test_release_readiness.py tests/test_candidate_promotion.py tests/test_workspace_runtime_observations.py tests/test_runtime_observation_packet.py tests/test_runtime_observation_workflow.py -q --junitxml=artifacts/repair/promotion.xml
          python scripts/check-required-tests.py --pytest-discovery artifacts/repair/promotion-discovery.txt --expected-count 95 --junit artifacts/repair/promotion.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: buyeros-promotion-controls
          path: artifacts/repair/promotion*
          if-no-files-found: error
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node tests/domain-checks.mjs
      - run: node tests/live-adapter-checks.mjs
      - name: Verify C61 candidate client intent and source privacy
        run: |
          mkdir -p artifacts/c61
          node --test --test-reporter=junit --test-reporter-destination=artifacts/c61/ci-candidate-client.xml tests/research-candidate-client.test.mjs
          python scripts/check-required-tests.py --junit artifacts/c61/ci-candidate-client.xml
      - run: node tests/live-auth-checks.mjs
      - run: node --test tests/audit-*.test.mjs tests/job-poller-checks.mjs
      - run: node --test tests/api-types-generation.test.mjs
      - run: node --test tests/vercel-services.test.mjs tests/deployment/cloudflare-python-runtime.test.mjs tests/deployment/cloudflare-acceptance.test.mjs tests/deployment/built-ui-fixture.test.mjs
      - run: node --test --test-reporter=junit --test-reporter-destination=artifacts/c61/ci-neon-session.xml tests/neon-session.test.mjs tests/audit-auth-render.test.mjs tests/job-poller-checks.mjs tests/neon-security-proxy.test.mjs
      - run: python scripts/check-required-tests.py --junit artifacts/c61/ci-neon-session.xml
      - run: node --test --test-reporter=junit --test-reporter-destination=artifacts/c61/ci-neon-config.xml tests/neon-production-config.test.mjs tests/neon-auth-boundary.test.mjs
      - run: python scripts/check-required-tests.py --junit artifacts/c61/ci-neon-config.xml
      - run: node --conditions=react-server --test --test-reporter=junit --test-reporter-destination=artifacts/c61/ci-neon-sdk.xml tests/neon-auth-server-production.test.mjs
      - run: python scripts/check-required-tests.py --junit artifacts/c61/ci-neon-sdk.xml
      - run: pnpm exec tsc --noEmit
      - run: pnpm lint
      - run: pnpm build
      - run: node scripts/run-vercel.mjs build
      - run: node --test --test-reporter=junit --test-reporter-destination=artifacts/c61/ci-neon-built.xml tests/neon-auth-built.test.mjs
      - run: python scripts/check-required-tests.py --junit artifacts/c61/ci-neon-built.xml
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify C61-25 polling budget and native connectivity defaults
        run: |
          node --test --test-reporter=junit --test-reporter-destination=artifacts/c61/ci-job-poller.xml tests/job-poller-checks.mjs
          python scripts/check-required-tests.py --junit artifacts/c61/ci-job-poller.xml
          pnpm exec playwright test --config playwright.job-poller.config.ts --list --reporter=json > artifacts/c61/ci-job-poller-discovery.json
          python scripts/check-required-tests.py --playwright-discovery artifacts/c61/ci-job-poller-discovery.json --expected-count 3 --expected-file job-poller-connectivity.spec.ts --discovery-only
          pnpm exec playwright test --config playwright.job-poller.config.ts
          python scripts/check-required-tests.py --playwright-discovery artifacts/c61/ci-job-poller-discovery.json --expected-count 3 --expected-file job-poller-connectivity.spec.ts --junit test-results/job-poller.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: buyeros-poller-local-boundary
          path: |
            artifacts/c61/ci-job-poller*
            test-results/job-poller.xml
            test-results/job-poller/
          if-no-files-found: error
      - run: |
          pnpm exec playwright test --config playwright.neon-runtime-built.config.ts --list > artifacts/c61/ci-neon-session-discovery.txt
          python -c "import pathlib,re; text=pathlib.Path('artifacts/c61/ci-neon-session-discovery.txt').read_text(); match=re.search(r'Total: (\d+) tests?',text); assert match and int(match[1])>0 and 'neon-session-production.spec.ts' in text and 'neon-security-production.spec.ts' in text, 'empty or wrong Neon discovery'"
          pnpm exec playwright test --config playwright.neon-runtime-built.config.ts --list --reporter=json > artifacts/c61/ci-neon-session-native-discovery.json
          python scripts/check-required-tests.py --playwright-discovery artifacts/c61/ci-neon-session-native-discovery.json --expected-count 8 --expected-file neon-session-production.spec.ts --expected-file neon-security-production.spec.ts --discovery-only
      - run: pnpm exec playwright test --config playwright.neon-runtime-built.config.ts
      - run: python scripts/check-required-tests.py --playwright-discovery artifacts/c61/ci-neon-session-native-discovery.json --expected-count 8 --expected-file neon-session-production.spec.ts --expected-file neon-security-production.spec.ts --junit test-results/neon-session.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: buyeros-neon-local-boundary
          path: |
            artifacts/c61/ci-neon-*.xml
            artifacts/c61/ci-neon-session-discovery.txt
            artifacts/c61/ci-neon-session-native-discovery.json
            test-results/neon-session.xml
            test-results/neon-session/
          if-no-files-found: error
      - run: node --test tests/vercel-render.test.mjs tests/deployment/cloudflare-release-config.test.mjs

  cloudflare-controller:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm cloudflare:types
      - run: pnpm cloudflare:lint
      - run: pnpm cloudflare:bindings
      - name: Discover full C61 controller inventory before execution
        run: |
          mkdir -p artifacts/cloudflare
          pnpm exec vitest list --config services/cloudflare-jobs/vitest.config.ts --json artifacts/cloudflare/ci-controller-discovery.json
          python -c "import json,pathlib; root=pathlib.Path.cwd().resolve(); rows=json.loads(pathlib.Path('artifacts/cloudflare/ci-controller-discovery.json').read_text()); names=[pathlib.Path(row['file']).resolve().relative_to(root).as_posix()+'::'+row['name'] for row in rows]; files={name.split('::',1)[0] for name in names}; assert len(names)==len(set(names))==27 and files==set(['services/cloudflare-jobs/tests/api-client.test.ts', 'services/cloudflare-jobs/tests/dispatcher.test.ts', 'services/cloudflare-jobs/tests/handler.test.ts', 'services/cloudflare-jobs/tests/platform.test.ts', 'services/cloudflare-jobs/tests/protocol.test.ts', 'services/cloudflare-jobs/tests/queue.test.ts', 'services/cloudflare-jobs/tests/workflow.test.ts', 'tests/integration/cloudflare-recovery.test.ts']), 'empty, duplicate or missing full controller discovery'"
      - name: Verify exact full C61 controller execution
        run: |
          pnpm cloudflare:test --reporter=default --reporter=junit --outputFile.junit=artifacts/cloudflare/ci-controller.xml
          python scripts/check-required-tests.py --junit artifacts/cloudflare/ci-controller.xml
          python -c "import json,pathlib,xml.etree.ElementTree as E; root=pathlib.Path.cwd().resolve(); rows=json.loads(pathlib.Path('artifacts/cloudflare/ci-controller-discovery.json').read_text()); discovered=[pathlib.Path(row['file']).resolve().relative_to(root).as_posix()+'::'+row['name'] for row in rows]; cases=list(E.parse('artifacts/cloudflare/ci-controller.xml').getroot().iter('testcase')); names=[c.get('classname').replace(chr(92),'/')+'::'+c.get('name') for c in cases]; assert len(cases)==len(set(names))==27 and set(names)==set(discovered) and not any(list(c.iter('failure')) or list(c.iter('error')) or list(c.iter('skipped')) for c in cases), 'empty, duplicate, missing or nonpassing full controller execution'"
      - run: pnpm exec wrangler deploy --dry-run --config services/cloudflare-jobs/wrangler.jsonc --outdir .sites-runtime/cloudflare-dry-run
        env:
          WRANGLER_SEND_METRICS: 'false'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: buyeros-cloudflare-local-controller
          path: artifacts/cloudflare/
          if-no-files-found: error

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: buyeros
          POSTGRES_PASSWORD: buyeros
          POSTGRES_DB: buyeros_test_api
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U buyeros -d buyeros_test_api"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BUYEROS_TEST_DATABASE_URL: postgresql://buyeros:buyeros@127.0.0.1:5432/buyeros_test_api
      BUYEROS_STRICT_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          # Q06 replays exact historical polling source, not a synthetic baseline.
          fetch-depth: 0
      # The mandatory owned-PG test drives the actual local Queue/Workflow runtime.
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.11.27
      - run: uv sync --frozen
        working-directory: services/api
      - run: uv run --frozen python ../../scripts/generate-operation-routes.py --check
        working-directory: services/api
      - run: uv run --frozen python ../../scripts/verify-render-blueprint.py
        working-directory: services/api
      - run: mkdir -p artifacts
        working-directory: services/api
      - name: Verify supported C61 migration to current head
        working-directory: services/api
        run: |
          uv run --frozen pytest tests/test_identity_migration_db.py --collect-only -q > artifacts/c61-supported-migration-discovery.txt
          python -c "import pathlib,re; text=pathlib.Path('artifacts/c61-supported-migration-discovery.txt').read_text(encoding='utf-8'); m=re.search(r'(\d+) tests? collected',text); names=[line for line in text.splitlines() if line.startswith('tests/test_identity_migration_db.py::test_')]; required={'tests/test_identity_migration_db.py::test_fresh_0038_backfill_and_retained_rollback_preserve_canonical_history','tests/test_identity_migration_db.py::test_identity_revision_preserves_runtime_off_and_rejects_unknown_future_head','tests/test_identity_migration_db.py::test_supported_0038_upgrade_to_current_head_preserves_history_and_restricted_runtime'}; assert m and int(m[1])==len(names)==len(set(names))==3 and set(names)==required, 'empty, duplicate or missing supported migration discovery'"
          uv run --frozen pytest tests/test_identity_migration_db.py --junitxml=artifacts/c61-supported-migration.xml
          python ../../scripts/check-required-tests.py --junit artifacts/c61-supported-migration.xml
          python -c "import pathlib,xml.etree.ElementTree as E; collected=[line for line in pathlib.Path('artifacts/c61-supported-migration-discovery.txt').read_text(encoding='utf-8').splitlines() if line.startswith('tests/test_identity_migration_db.py::test_')]; cases=list(E.parse('artifacts/c61-supported-migration.xml').getroot().iter('testcase')); names=[c.get('classname').replace('.','/')+'.py::'+c.get('name') for c in cases]; assert len(names)==len(set(names))==len(collected)==3 and set(names)==set(collected), 'missing or mismatched supported migration execution'"
      - name: Verify required Neon security discovery
        working-directory: services/api
        run: |
          uv run --frozen pytest tests/test_neon_security_db.py tests/test_auth_tenant.py tests/test_membership_directory_db.py --collect-only -q > artifacts/neon-security-discovery.txt
          python -c "import pathlib,re; text=pathlib.Path('artifacts/neon-security-discovery.txt').read_text(); match=re.search(r'(\d+) tests collected',text); assert match and int(match[1])>0 and 'test_neon_security_db.py::test_signed_neon_DB_roles_and_foreign_workspace_existence' in text, 'empty or missing Neon security discovery'"
      - name: Verify required C61 search discovery
        working-directory: services/api
        run: |
          uv run --frozen pytest tests/test_live_search_adapter.py tests/test_live_search_db.py tests/test_live_search_guards.py --collect-only -q > artifacts/c61-search-discovery.txt
          python -c "import pathlib,re; text=pathlib.Path('artifacts/c61-search-discovery.txt').read_text(); match=re.search(r'(\d+) tests collected',text); assert match and int(match[1])>0 and all(name in text for name in ['test_search_wrong_entity_not_attached','test_search_timeout_unknown_not_resubmitted','test_fetch_redirect_private_blocked','test_runtime_epoch_change_during_response_cannot_claim_accepted']), 'empty or missing required search discovery'"
      - name: Verify required C61 model discovery
        working-directory: services/api
        run: |
          uv run --frozen pytest tests/test_live_model_adapter.py tests/test_model_migration_payload.py --collect-only -q > artifacts/c61-model-discovery.txt
          python -c "import pathlib,re; text=pathlib.Path('artifacts/c61-model-discovery.txt').read_text(); match=re.search(r'(\d+) tests collected',text); assert match and int(match[1])>0 and all(name in text for name in ['test_model_citation_must_resolve_to_current_company','test_source_instruction_cannot_change_tools_or_request_scope','test_model_durable_claim_never_replays_unknown_or_received','test_unselected_live_fit_does_not_invent_a_model_proposal']), 'empty or missing required model discovery'"
      - name: Verify required C61 contact discovery
        working-directory: services/api
        run: |
          uv run --frozen pytest tests/test_live_contact_adapter.py tests/test_live_contact_db.py tests/test_contact_migration_payload.py --collect-only -q > artifacts/c61-contact-discovery.txt
          python -c "import pathlib,re; text=pathlib.Path('artifacts/c61-contact-discovery.txt').read_text(); match=re.search(r'(\d+) tests collected',text); assert match and int(match[1])>0 and all(name in text for name in ['test_contact_quote_stale_price_blocks','test_contact_wrong_company_quarantined','test_actual_confirm_single_contact_operation_and_encrypted_reopen_without_billing','test_contact_runtime_rls_immutable_private_result_and_populated_rollback']), 'empty or missing required contact discovery'"
      - name: Verify required C61 reviewed contact configuration discovery
        working-directory: services/api
        run: |
          uv run --frozen pytest tests/test_selected_contact_configuration.py --collect-only -q > artifacts/c61-contact-configuration-discovery.txt
          python -c "import pathlib,re; text=pathlib.Path('artifacts/c61-contact-configuration-discovery.txt').read_text(); m=re.search(r'(\d+) tests collected',text); assert m and int(m[1])==50 and all(name in text for name in ('test_contact_planning_requires_current_bounded_reviewed_account_and_status_without_factory[verified-US]', 'test_contact_planning_requires_current_bounded_reviewed_account_and_status_without_factory[unsupported-pair]', 'test_contact_planning_requires_current_bounded_reviewed_account_and_status_without_factory[missing-nonbillable-evidence]', 'test_contact_scope_rejects_mutable_unbounded_or_nonopaque_account_and_lookup_basis[email-account]', 'test_contact_scope_rejects_mutable_unbounded_or_nonopaque_account_and_lookup_basis[boolean-limit]', 'test_contact_registration_rejects_scope_not_owned_by_its_exact_hunter_capability[mutable-capability-roles]', 'test_contact_full_registry_hash_binds_account_pair_count_and_nonbillable_proof_preserving_old_receipt_hash', 'test_default_contact_planning_and_both_public_selectors_remain_closed')), 'empty or missing reviewed contact configuration discovery'"
      - name: Verify required C61 current contact quote and claim discovery
        working-directory: services/api
        run: |
          uv run --frozen pytest tests/test_contact_registry_scope_db.py --collect-only -q > artifacts/c61-contact-current-scope-discovery.txt
          python -c "import pathlib,re; text=pathlib.Path('artifacts/c61-contact-current-scope-discovery.txt').read_text(); m=re.search(r'(\d+) tests collected',text); assert m and int(m[1])==32 and all(name in text for name in ('test_production_quote_freezes_full_current_contact_scope_without_factory_budget_or_operation', 'test_changed_contact_registry_requires_fresh_explicit_quote_before_confirm_admission[account]', 'test_production_quote_rejects_typed_capability_without_exact_current_reviewed_registry[unselected]', 'test_new_private_contact_prepare_rechecks_full_confirmed_quote_before_receipt_write[request-count]', 'test_prepared_contact_claim_rechecks_full_current_registry_before_supplier_io[unbound-quote]', 'test_original_contact_received_or_unknown_reopens_after_current_scope_revocation_without_resubmit[received]', 'test_original_contact_received_or_unknown_reopens_after_current_scope_revocation_without_resubmit[unknown]')), 'empty or missing current contact quote/claim discovery'"
      - name: Discover independent C61 delivery core and current approval preparation
        working-directory: services/api
        run: |
          uv run --frozen pytest tests/test_delivery_protocol.py tests/test_delivery_preparation_db.py --collect-only -q > artifacts/c61-delivery-core-discovery.txt
          python -c "import pathlib,re; text=pathlib.Path('artifacts/c61-delivery-core-discovery.txt').read_text(encoding='utf-8'); m=re.search(r'(\d+) tests? collected',text); names=[line for line in text.splitlines() if line.startswith(('tests/test_delivery_protocol.py::test_', 'tests/test_delivery_preparation_db.py::test_'))]; required=['test_delivery_intent_is_immutable_and_independent_of_contact_service', 'test_delivery_webhook_verifies_official_svix_example_raw_bytes', 'test_delivery_preparation_resolves_exact_server_revision_and_retains_disabled_route', 'test_delivery_preparation_foreign_workspace_is_denied_with_owned_positive_control', 'test_delivery_status_result_keeps_observed_reference_and_cannot_authorize_resubmit', 'test_delivery_status_result_rejects_invalid_or_local_only_state_before_any_IO', 'test_delivery_status_result_validator_preserves_exact_original_reference', 'test_delivery_status_result_validator_refuses_rebinding_to_another_reference', 'test_delivery_status_result_validator_rejects_untyped_or_ambiguous_result', 'test_delivery_status_result_validator_rejects_missing_original_query_reference', 'test_delivery_status_result_validator_rechecks_even_frozen_result_data', 'test_delivery_accepted_unknown_or_submitting_never_authorizes_resubmit[unknown]', 'test_delivery_status_never_regresses_or_confuses_acceptance_and_delivery[delivered-accepted-delivered]', 'test_delivery_preparation_rechecks_current_policy_recipient_sender_and_revision[policy]', 'test_delivery_preparation_rechecks_current_policy_recipient_sender_and_revision[suppression]']; assert m and int(m[1])==len(names)==len(set(names))==87 and all(any(item.split('::')[-1]==name or item.split('::')[-1].startswith(name+'[') for item in names) for name in required), 'empty, duplicate or missing independent delivery core discovery'"
          uv run --frozen pytest tests/test_delivery_protocol.py tests/test_delivery_preparation_db.py --junitxml=artifacts/c61-delivery-core.xml
          python ../../scripts/check-required-tests.py --junit artifacts/c61-delivery-core.xml
          python -c "import pathlib,xml.etree.ElementTree as E; discovered=[line for line in pathlib.Path('artifacts/c61-delivery-core-discovery.txt').read_text(encoding='utf-8').splitlines() if line.startswith(('tests/test_delivery_protocol.py::test_', 'tests/test_delivery_preparation_db.py::test_'))]; cases=list(E.parse('artifacts/c61-delivery-core.xml').getroot().iter('testcase')); names=[c.get('classname').replace('.','/')+'.py::'+c.get('name') for c in cases]; assert len(cases)==len(set(names))==87 and set(names)==set(discovered) and not any(list(c.iter('failure')) or list(c.iter('error')) or list(c.iter('skipped')) for c in cases), 'empty, duplicate, missing or nonpassing independent delivery execution'"
      - name: Discover retained C61 delivery status and original unknown liability
        working-directory: services/api
        run: |
          uv run --frozen pytest tests/test_delivery_status_db.py --collect-only -q > artifacts/c61-delivery-status-discovery.txt
          python -c "import pathlib,re; text=pathlib.Path('artifacts/c61-delivery-status-discovery.txt').read_text(encoding='utf-8'); m=re.search(r'(\d+) tests? collected',text); names=[line for line in text.splitlines() if line.startswith('tests/test_delivery_status_db.py::test_')]; required=['test_status_default_refuses_before_database_or_provider_IO', 'test_status_original_unknown_once_acceptance_is_distinct_from_delivery_and_never_resends', 'test_status_wrong_original_scope_has_exact_denial_and_no_state_or_hold_change', 'test_status_foreign_tenant_denial_has_matching_owned_positive_control', 'test_status_adverse_observation_deduplicates_suppression_and_retains_original_full_hold', 'test_status_caller_abort_rolls_back_observation_suppression_and_approval', 'test_status_expiry_after_writes_rolls_back_even_when_outer_caller_commits', 'test_status_twelve_parallel_observations_commit_one_event_without_extra_cost', 'test_status_reconciliation_survives_new_admission_role_and_approval_revocation', 'test_status_missing_or_changed_original_liability_never_invents_receipts_or_releases_hold']; assert m and int(m[1])==len(names)==len(set(names))==27 and all(any(item.split('::')[-1]==name or item.split('::')[-1].startswith(name+'[') for item in names) for name in required), 'empty, duplicate or missing retained delivery status discovery'"
          uv run --frozen pytest tests/test_delivery_status_db.py --junitxml=artifacts/c61-delivery-status.xml
          python ../../scripts/check-required-tests.py --junit artifacts/c61-delivery-status.xml
          python -c "import pathlib,xml.etree.ElementTree as E; discovered=[line for line in pathlib.Path('artifacts/c61-delivery-status-discovery.txt').read_text(encoding='utf-8').splitlines() if line.startswith('tests/test_delivery_status_db.py::test_')]; cases=list(E.parse('artifacts/c61-delivery-status.xml').getroot().iter('testcase')); names=[c.get('classname').replace('.','/')+'.py::'+c.get('name') for c in cases]; assert len(cases)==len(set(names))==27 and set(names)==set(discovered) and not any(list(c.iter('failure')) or list(c.iter('error')) or list(c.iter('skipped')) for c in cases), 'empty, duplicate, missing or nonpassing retained delivery status execution'"
      - name: Discover fenced C61 delivery submit claim and immutable original scope
        working-directory: services/api
