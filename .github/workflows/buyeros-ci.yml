name: BuyerOS CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node tests/domain-checks.mjs
      - run: node tests/live-adapter-checks.mjs
      - run: node tests/live-auth-checks.mjs
      - run: node --test tests/api-types-generation.test.mjs
      - run: node --test tests/vercel-services.test.mjs tests/deployment/cloudflare-python-runtime.test.mjs tests/deployment/cloudflare-acceptance.test.mjs tests/deployment/built-ui-fixture.test.mjs
      - run: pnpm exec tsc --noEmit
      - run: pnpm lint
      - run: pnpm build
      - run: node scripts/run-vercel.mjs build
      - run: node --test tests/vercel-render.test.mjs tests/deployment/cloudflare-release-config.test.mjs

  cloudflare-controller:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm cloudflare:types
      - run: pnpm cloudflare:lint
      - run: pnpm cloudflare:bindings
      - run: pnpm cloudflare:test --reporter=default --reporter=junit --outputFile.junit=artifacts/cloudflare/ci-controller.xml
      - run: pnpm exec wrangler deploy --dry-run --config services/cloudflare-jobs/wrangler.jsonc --outdir .sites-runtime/cloudflare-dry-run
        env:
          WRANGLER_SEND_METRICS: 'false'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: buyeros-cloudflare-local-controller
          path: artifacts/cloudflare/
          if-no-files-found: error

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: buyeros
          POSTGRES_PASSWORD: buyeros
          POSTGRES_DB: buyeros_test_api
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U buyeros -d buyeros_test_api"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BUYEROS_TEST_DATABASE_URL: postgresql://buyeros:buyeros@127.0.0.1:5432/buyeros_test_api
      BUYEROS_STRICT_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@v4
      # The mandatory owned-PG test drives the actual local Queue/Workflow runtime.
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.11.27
      - run: uv sync --frozen
        working-directory: services/api
      - run: uv run --frozen python ../../scripts/generate-operation-routes.py --check
        working-directory: services/api
      - run: uv run --frozen python ../../scripts/verify-render-blueprint.py
        working-directory: services/api
      - run: mkdir -p artifacts
        working-directory: services/api
      - run: uv run --frozen pytest -q --junitxml=artifacts/tests.xml
        working-directory: services/api
      - run: python scripts/check-required-tests.py --junit services/api/artifacts/tests.xml

  worker:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: buyeros
          POSTGRES_PASSWORD: buyeros
          POSTGRES_DB: buyeros_test_worker
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U buyeros -d buyeros_test_worker"
          --health-interval 5s --health-timeout 5s --health-retries 10
      valkey:
        image: valkey/valkey:8
        ports: ['6379:6379']
    env:
      BUYEROS_TEST_DATABASE_URL: postgresql://buyeros:buyeros@127.0.0.1:5432/buyeros_test_worker
      BUYEROS_STRICT_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.11.27
      - run: uv sync --frozen
        working-directory: services/worker
      - run: uv run --frozen python -m unittest discover -s ../../tests -p test_render_worker_launch.py
        working-directory: services/worker
      - run: uv run --frozen python ../../tests/render-worker-process-check.py
        working-directory: services/worker
      - run: mkdir -p artifacts
        working-directory: services/worker
      - run: uv run --frozen pytest -q --junitxml=artifacts/tests.xml
        working-directory: services/worker
      - run: python scripts/check-required-tests.py --junit services/worker/artifacts/tests.xml
      - run: python -m pip install uv==0.11.27 && uv sync --project services/worker --frozen --no-dev --python 3.12
      - run: services/worker/.venv/bin/python scripts/run-render-worker.py worker --check
      - run: services/worker/.venv/bin/python scripts/run-render-worker.py dispatcher --check
      - run: services/worker/.venv/bin/python -m celery -A buyeros_worker.app:celery_app worker --help
      - run: services/worker/.venv/bin/python -m buyeros_worker.cli dispatch --help

  browser-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: buyeros
          POSTGRES_PASSWORD: buyeros
          POSTGRES_DB: buyeros_test_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U buyeros -d buyeros_test_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BUYEROS_TEST_DATABASE_URL: postgresql://buyeros:buyeros@127.0.0.1:5432/buyeros_test_e2e
      BUYEROS_STRICT_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.11.27
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen
        working-directory: services/api
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test tests/e2e/harness.spec.ts

  browser-zoom:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: buyeros
          POSTGRES_PASSWORD: buyeros
          POSTGRES_DB: buyeros_test_zoom
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U buyeros -d buyeros_test_zoom"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BUYEROS_TEST_DATABASE_URL: postgresql://buyeros:buyeros@127.0.0.1:5432/buyeros_test_zoom
      BUYEROS_STRICT_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.11.27
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen
        working-directory: services/api
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test --config playwright.live-zoom.config.ts tests/e2e/api-browser-zoom.spec.ts --reporter=line,junit
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: test-results/zoom.xml
      - run: python scripts/check-required-tests.py --junit test-results/zoom.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: buyeros-api-actual-zoom
          path: test-results/
          if-no-files-found: error

  cloudflare-staff-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # All fixtures own loopback databases; never supply a production/shared DSN.
    env:
      BUYEROS_STRICT_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.11.27
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen
        working-directory: services/api
      - run: uv sync --frozen
        working-directory: services/worker
      - run: pnpm exec playwright install --with-deps chromium
      - run: .venv/bin/python ../../scripts/run-cloudflare-pg18-proof.py
        working-directory: services/api
      - run: python scripts/check-required-tests.py --junit artifacts/cloudflare/CF08-pg18.xml
      - run: uv run --frozen pytest -q tests/benchmark_cloudflare_case.py --junitxml=../../artifacts/cloudflare/ci-operating.xml
        working-directory: services/api
      - run: python scripts/check-required-tests.py --junit artifacts/cloudflare/ci-operating.xml
      - run: node scripts/run-cloudflare-acceptance.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: buyeros-cloudflare-local-staff-and-operating
          path: |
            artifacts/cloudflare/
            test-results/cloudflare/
            test-results/cloudflare-continuity-*-fixture.png
          if-no-files-found: error

  browser-continuity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The reviewed helper requires its own named, loopback-only Postgres
    # container. Do not point its destructive fixture at a shared database.
    env:
      BUYEROS_STRICT_INTEGRATION: '1'
      PLAYWRIGHT_JUNIT_OUTPUT_FILE: test-results/t30-browser.xml
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.11.27
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen
        working-directory: services/api
      - run: uv sync --frozen
        working-directory: services/worker
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test --config playwright.mvp-research.config.ts tests/e2e/mvp-a-research.spec.ts --reporter=line,junit
      - run: python scripts/check-required-tests.py --junit test-results/t30-browser.xml
      - run: |
          mkdir -p artifacts/ci-t30/continuity
          cp -r test-results/. artifacts/ci-t30/continuity/
      - run: pnpm exec playwright test --config playwright.workbench.config.ts tests/e2e/daily-workbench.spec.ts --reporter=line,junit
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: test-results/workbench.xml
      - run: |
          python scripts/check-required-tests.py --junit test-results/workbench.xml
          mkdir -p artifacts/ci-t30/workbench
          cp -r test-results/. artifacts/ci-t30/workbench/
      - run: pnpm exec playwright test --config playwright.buyer.config.ts tests/e2e/buyer-results.spec.ts --workers=1 --reporter=line,junit
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: test-results/buyers.xml
      - run: |
          python scripts/check-required-tests.py --junit test-results/buyers.xml
          mkdir -p artifacts/ci-t30/buyers
          cp -r test-results/. artifacts/ci-t30/buyers/
      - run: pnpm exec playwright test --config playwright.buyer-management.config.ts tests/e2e/buyer-management.spec.ts --workers=1 --reporter=line,junit
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: test-results/buyer-management.xml
      - run: |
          python scripts/check-required-tests.py --junit test-results/buyer-management.xml
          mkdir -p artifacts/ci-t30/buyer-management
          cp -r test-results/. artifacts/ci-t30/buyer-management/
      - run: pnpm exec playwright test --config playwright.mvp.config.ts tests/e2e/mvp-a-journey.spec.ts --reporter=line,junit
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: test-results/mvp-acceptance.xml
      - run: |
          python scripts/check-required-tests.py --junit test-results/mvp-acceptance.xml
          mkdir -p artifacts/ci-t30/mvp-acceptance
          cp -r test-results/. artifacts/ci-t30/mvp-acceptance/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: buyeros-bilingual-continuity-fixture
          path: |
            test-results/
            artifacts/ci-t30/
          if-no-files-found: error
