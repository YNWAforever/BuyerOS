      - name: Discover independent C61 legacy delivery routing and retained holds
        working-directory: services/worker
        run: |
          uv run --frozen pytest tests/test_delivery_routing_db.py --collect-only -q > artifacts/c61-legacy-delivery-routing-discovery.txt
          python -c "import pathlib,re; text=pathlib.Path('artifacts/c61-legacy-delivery-routing-discovery.txt').read_text(encoding='utf-8'); m=re.search(r'(\d+) tests? collected',text); names=[line for line in text.splitlines() if line.startswith('tests/test_delivery_routing_db.py::test_')]; assert m and int(m[1])==len(names)==len(set(names))==4 and all(name in text for name in ('test_legacy_delivery_intent_never_resolves_contact_or_releases_original_hold[False-False]', 'test_legacy_delivery_intent_never_resolves_contact_or_releases_original_hold[True-False]', 'test_legacy_delivery_intent_never_resolves_contact_or_releases_original_hold[False-True]', 'test_legacy_delivery_intent_never_resolves_contact_or_releases_original_hold[True-True]')), 'empty or missing required delivery discovery'"
          env -u BUYEROS_TEST_DATABASE_URL uv run --frozen pytest tests/test_delivery_routing_db.py --junitxml=artifacts/c61-legacy-delivery-routing.xml
          python ../../scripts/check-required-tests.py --junit artifacts/c61-legacy-delivery-routing.xml
          python -c "import xml.etree.ElementTree as E; cases=list(E.parse('artifacts/c61-legacy-delivery-routing.xml').getroot().iter('testcase')); names=[c.get('name') for c in cases]; assert len(cases)==len(set(names))==4 and all(any(item==name or item.startswith(name+'[') for item in names) for name in ('test_legacy_delivery_intent_never_resolves_contact_or_releases_original_hold[False-False]', 'test_legacy_delivery_intent_never_resolves_contact_or_releases_original_hold[True-False]', 'test_legacy_delivery_intent_never_resolves_contact_or_releases_original_hold[False-True]', 'test_legacy_delivery_intent_never_resolves_contact_or_releases_original_hold[True-True]')), 'missing or duplicate delivery execution'"

      - name: Verify bounded C61 worker claim and capacity gate discovery
        working-directory: services/worker
        run: |
          uv run --frozen pytest tests/test_claim_limit_db.py tests/test_worker_capacity_tools.py --collect-only -q > artifacts/c61-claim-capacity-discovery.txt
          python -c "import pathlib,re; text=pathlib.Path('artifacts/c61-claim-capacity-discovery.txt').read_text(); m=re.search(r'(\d+) tests collected',text); assert m and int(m[1])==29 and all(name in text for name in ('test_actual_single_tenant_claim_respects_locked_limit[1]', 'test_actual_single_tenant_claim_respects_locked_limit[3]', 'test_worker_capacity_requires_named_positive_zero_skip_junit', 'test_worker_capacity_continues_returned_cursor_after_empty_budget_cycle', 'test_worker_capacity_stalled_backlog_stops_with_all_empty_cycles_retained', 'test_worker_capacity_named_pass_cannot_hide_missing_raw_denominator[incomplete]', 'test_worker_capacity_named_pass_cannot_hide_missing_raw_denominator[empty]', 'test_worker_capacity_named_pass_cannot_hide_missing_raw_denominator[same-worker]', 'test_worker_resource_sampler_reads_the_owned_live_process')) and all('test_worker_capacity_rejects_missing_or_invalid_resource_measurement['+name+']' in text for name in ('missing-memory','missing-second-worker','unowned-pid','zero-rss','missing-queue','nonfinite-age','negative-age','missing-tenant','launcher-only')), 'empty or missing bounded claim/capacity discovery'"
      - name: Verify required C61 worker research guard discovery
        working-directory: services/worker
        run: |
          uv run --frozen pytest tests/test_live_research_journey_db.py --collect-only -q > artifacts/c61-research-guard-discovery.txt
          python -c "import pathlib,re; text=pathlib.Path('artifacts/c61-research-guard-discovery.txt').read_text(); match=re.search(r'(\d+) tests collected',text); assert match and int(match[1])>0 and all(name in text for name in ['test_crash_after_provider_acceptance_reconciles', 'test_unknown_intent_uses_status_only_at_original_epoch', 'test_old_epoch_cannot_commit', 'test_research_continuations_keep_original_selector_epoch']), 'empty or missing required research guard discovery'"
      - name: Verify required C61 fit discovery
        working-directory: services/worker
        run: |
          mkdir -p artifacts
          uv run --frozen pytest tests/test_live_fit_db.py tests/test_research_graph.py --collect-only -q > artifacts/c61-fit-discovery.txt
          python -c "import pathlib,re; text=pathlib.Path('artifacts/c61-fit-discovery.txt').read_text(); match=re.search(r'(\d+) tests collected',text); assert match and int(match[1])>0 and all(name in text for name in ['test_stale_basis_cannot_persist_match','test_live_model_pg_receipt_survives_restart_without_new_submission']), 'empty or missing required fit discovery'"
      - name: Discover full native C61 worker inventory before execution
        working-directory: services/worker
        run: |
