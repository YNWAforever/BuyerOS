          python ../../scripts/check-required-tests.py --pytest-discovery artifacts/c61-full-discovery.txt --expected-count 362 --discovery-only
      - run: uv run --frozen pytest tests -q --junitxml=artifacts/tests.xml
        working-directory: services/worker
