name: BuyerOS guarded promotion
on:
  workflow_dispatch:
    inputs:
      runtime_run_id:
        description: Successful same-main protected runtime bundle run
        required: true
        type: string
permissions:
  contents: read
  actions: read
  attestations: read
  deployments: write
concurrency:
  group: buyeros-production-promote
  cancel-in-progress: false
jobs:
  promote:
    if: github.ref == 'refs/heads/main'
    environment: buyeros-production-promote
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: python -m pip install uv==0.11.27
      - run: uv sync --frozen
        working-directory: services/api
      - run: npm install --global vercel@50.28.0
      - name: Fetch encrypted runtime bundle and verify protected gates before one alias call
        env:
          BUYEROS_RELEASE_LEDGER_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ secrets.BUYEROS_PROMOTION_METADATA_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          BUYEROS_RUNTIME_BUNDLE_ENCRYPTION_KEY: ${{ secrets.BUYEROS_RUNTIME_BUNDLE_ENCRYPTION_KEY }}
          BUYEROS_RELEASE_PROBE_TOKEN: ${{ secrets.BUYEROS_RELEASE_PROBE_TOKEN }}
          RUNTIME_RUN_ID: ${{ inputs.runtime_run_id }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          [[ "$RUNTIME_RUN_ID" =~ ^[0-9]+$ ]]
          gh run download "$RUNTIME_RUN_ID" --repo YNWAforever/BuyerOS --name buyeros-attested-runtime --dir "$RUNNER_TEMP/runtime"
          services/api/.venv/bin/python scripts/promote-candidate.py --bundle "$RUNNER_TEMP/runtime/runtime-bundle.json" --gate workspace --output artifacts/promotion.json --execute > "$RUNNER_TEMP/buyeros-promotion.log" 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: buyeros-promotion-readback-required
          path: artifacts/promotion.json
          if-no-files-found: error
