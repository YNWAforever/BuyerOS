name: BuyerOS protected runtime bundle
on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful current-main BuyerOS CI run containing all required jobs
        required: true
        type: string
      stage_candidate:
        description: Explicitly stage the reviewed production build without assigning domains
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: buyeros-protected-runtime-bundle
  cancel-in-progress: false
jobs:
  stage-probe:
    if: github.ref == 'refs/heads/main'
    environment: buyeros-runtime-readonly
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      candidate_url: ${{ steps.stage.outputs.candidate_url }}
      deployment_id: ${{ steps.stage.outputs.deployment_id }}
      source_sha: ${{ steps.stage.outputs.source_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: python -m pip install uv==0.11.27
      - run: uv sync --frozen
        working-directory: services/api
      - run: npm install --global vercel@50.28.0
      - run: pnpm install --frozen-lockfile
      - name: Verify controls then stage and collect bounded private observations
        id: stage
        env:
          GH_TOKEN: ${{ secrets.BUYEROS_PROMOTION_METADATA_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          BUYEROS_ENABLE_PROTECTED_STAGE: ${{ inputs.stage_candidate }}
          BUYEROS_G0_TARGET_JSON: ${{ secrets.BUYEROS_G0_TARGET_JSON }}
          BUYEROS_SCHEMA_CONTRACT_JSON: ${{ secrets.BUYEROS_SCHEMA_CONTRACT_JSON }}
          BUYEROS_G0_CONTRACT_SHA256: ${{ vars.BUYEROS_G0_CONTRACT_SHA256 }}
          BUYEROS_SCHEMA_CONTRACT_SHA256: ${{ vars.BUYEROS_SCHEMA_CONTRACT_SHA256 }}
          BUYEROS_RUNTIME_READ_SCOPE_SHA256: ${{ secrets.BUYEROS_RUNTIME_READ_SCOPE_SHA256 }}
          BUYEROS_G0_OWNED_TOKEN: ${{ secrets.BUYEROS_G0_OWNED_TOKEN }}
          BUYEROS_G0_FOREIGN_TOKEN: ${{ secrets.BUYEROS_G0_FOREIGN_TOKEN }}
          BUYEROS_G0_EMPTY_TOKEN: ${{ secrets.BUYEROS_G0_EMPTY_TOKEN }}
          BUYEROS_G0_REVOKED_TOKEN: ${{ secrets.BUYEROS_G0_REVOKED_TOKEN }}
          BUYEROS_RELEASE_PROBE_TOKEN: ${{ secrets.BUYEROS_RELEASE_PROBE_TOKEN }}
          BUYEROS_RUNTIME_OBSERVATION_ENCRYPTION_KEY: ${{ secrets.BUYEROS_RUNTIME_OBSERVATION_ENCRYPTION_KEY }}
          BUYEROS_ROLLBACK_DEPLOYMENT_ID: ${{ vars.BUYEROS_ROLLBACK_DEPLOYMENT_ID }}
          BUYEROS_NEON_ACCEPTANCE_RECEIPT_JSON: ${{ secrets.BUYEROS_NEON_ACCEPTANCE_RECEIPT_JSON }}
        run: services/api/.venv/bin/python scripts/protected-runtime.py stage --ci-run-id "$CI_RUN_ID" --output "$RUNNER_TEMP/buyeros-stage.encrypted.json" > "$RUNNER_TEMP/buyeros-stage.log" 2>&1
      - name: Publish encrypted intermediate observations only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: buyeros-private-observations-encrypted
          path: ${{ runner.temp }}/buyeros-stage.encrypted.json
          if-no-files-found: error
          retention-days: 1
  bundle-signoff:
    if: github.ref == 'refs/heads/main'
    needs: stage-probe
    environment:
      name: buyeros-production-promote
      url: ${{ needs.stage-probe.outputs.candidate_url }}
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: python -m pip install uv==0.11.27
      - run: uv sync --frozen
        working-directory: services/api
      - run: npm install --global vercel@50.28.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: buyeros-private-observations-encrypted
          path: ${{ runner.temp }}/encrypted-stage
      - name: Verify recorded non-self browser approval then encrypt complete runtime bundle
        env:
          GH_TOKEN: ${{ secrets.BUYEROS_PROMOTION_METADATA_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          BUYEROS_RUNTIME_OBSERVATION_ENCRYPTION_KEY: ${{ secrets.BUYEROS_RUNTIME_OBSERVATION_ENCRYPTION_KEY }}
          BUYEROS_RUNTIME_BUNDLE_ENCRYPTION_KEY: ${{ secrets.BUYEROS_RUNTIME_BUNDLE_ENCRYPTION_KEY }}
        run: services/api/.venv/bin/python scripts/protected-runtime.py sign --input "$RUNNER_TEMP/encrypted-stage/buyeros-stage.encrypted.json" --output "$RUNNER_TEMP/runtime-bundle.json" > "$RUNNER_TEMP/buyeros-sign.log" 2>&1
      - name: Attest exact ciphertext only
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/runtime-bundle.json
      - name: Publish complete encrypted workspace runtime bundle only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: buyeros-attested-runtime
          path: ${{ runner.temp }}/runtime-bundle.json
          if-no-files-found: error
          retention-days: 1
