              "type": "string",
              "format": "uuid"
            }
          },
          {
            "name": "Idempotency-Key",
            "in": "header",
            "required": true,
            "schema": {
              "maxLength": 200,
              "minLength": 8,
              "title": "Idempotency-Key",
              "type": "string"
            },
            "description": "Native opaque 8..200-character key, bound to actor, operation, target, body and If-Match; different intent with the same key conflicts."
          },
          {
            "name": "If-Match",
