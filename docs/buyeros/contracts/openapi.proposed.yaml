    SignedMoney:
      type: object
      additionalProperties: false
      properties:
        amount:
          type: string
          pattern: ^-?(0|[1-9][0-9]*)\.[0-9]{6}$
          examples:
          - '-0.300000'
        currency:
          type: string
          enum:
          - USD
      required:
      - amount
      - currency
      description: Net metered period amount can be negative when a refund/reversal occurs in this interval. Budgets,
        quotes and reservations use nonnegative Money instead.
    SenderIdentityUpdate:
      type: object
      additionalProperties: false
      properties:
        display_name:
          type: string
          minLength: 2
          maxLength: 160
        role_title:
          type: string
          maxLength: 160
        organization:
          type: string
          minLength: 2
          maxLength: 200
        business_email:
          type: string
          format: email
        country:
          type: string
          pattern: ^[A-Z]{2}$
        sender_confirmation:
          type: boolean
          const: true
      required:
      - display_name
      - organization
      - business_email
      - country
      - sender_confirmation
      description: Project-level human-reviewed identity configuration only. PATCH project field requires reviewer
        or workspace_admin and creates immutable identity version; operator cannot assert approval. No mailbox OAuth
        or sending is activated, and this review does not prove mailbox ownership.
    SenderIdentity:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        version_key:
          type: string
          pattern: ^sender:[a-f0-9-]{36}:[1-9][0-9]*$
        display_name:
          type: string
        role_title:
          type: string
        organization:
          type: string
        business_email:
          type: string
          format: email
        country:
          type: string
          pattern: ^[A-Z]{2}$
        status:
          type: string
          enum:
          - approved
          - retired
        reviewed_by:
          type: string
          format: uuid
        reviewed_at:
          type: string
          format: date-time
      required:
      - id
      - workspace_id
      - project_id
      - version_key
      - display_name
      - organization
      - business_email
      - country
      - status
      - reviewed_by
      - reviewed_at
      description: Read-only server-generated immutable project sender identity. This is reviewed preparation context;
        sender-domain/mailbox ownership verification remains a separate later delivery gate.
