    RunLimits:
      type: object
      additionalProperties: false
      properties:
        query_rounds:
          type: integer
          minimum: 1
          maximum: 3
          description: Maximum adaptive query-planning rounds within total query budget.
        max_results:
          type: integer
          minimum: 1
          maximum: 300
          description: Total raw returned candidate rows, including duplicates, across all attempts.
        max_pages:
          type: integer
          minimum: 1
          maximum: 200
          description: Total page-fetch attempts, including retries, across the logical run.
        max_page_bytes:
          type: integer
          minimum: 1024
          maximum: 2097152
          description: Maximum decoded bytes per page; compressed transfer must also be bounded.
        max_duration_seconds:
          type: integer
          minimum: 60
          maximum: 1800
          description: Absolute wall-clock ceiling from first external dispatch, including pauses/restarts. A retry
            never resets it.
        max_model_tokens:
          type: integer
          minimum: 1
          maximum: 100000
          description: Cumulative input plus output tokens across every model call, schema repair, escalation and
            retry.
        provider_concurrency:
          type: integer
          minimum: 1
          maximum: 4
          description: Maximum concurrent external provider operations for this run; shared provider-account limits
            may be lower.
        max_queries_per_run:
          type: integer
          minimum: 1
          maximum: 12
          description: Total search-query dispatches across every round and known-safe retry; maximum 12 for the
            whole logical run, never 12 per round.
      required:
      - query_rounds
      - max_queries_per_run
      - max_results
      - max_pages
      - max_page_bytes
      - max_duration_seconds
      - max_model_tokens
      - provider_concurrency
      description: 'PROPOSED per-logical-run cumulative hard ceilings, shared by all rounds/attempts/retries: at
        most 3 rounds and 12 total query dispatches, 300 raw rows, 200 page-fetch attempts, 2 MiB/page, 1,800 sec
        wall time since first dispatch, 100,000 model input+output tokens, and 4 concurrent provider operations.
        Server may lower caps; retry never resets counters or time.'
