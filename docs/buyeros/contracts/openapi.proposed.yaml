components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Proposed managed Auth0 Authorization Code + PKCE access token. Verify issuer/audience/algorithm/signature/expiry;
        current DB membership is tenant authority. Actual issuer, audience, callback URLs BLOCKED.
    ProviderSignature:
      type: apiKey
      in: header
      name: X-Provider-Signature
      description: PROPOSED placeholder, not a verified provider header. BO-002 must replace with vendor-documented
        raw-body signature and replay validation before activation.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 200
      description: Opaque non-PII key. Server scopes by workspace, actor, operation ID and key; stores canonical
        request hash. Same key+body returns original response; same key+different body is 409. Persistent provider
        operation identity outlives API replay cache.
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: ^"[1-9][0-9]*"$
      description: Strong version ETag, e.g. "4". Compare in mutation transaction; stale is 412 STALE_REVISION,
        missing is 400.
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    Error:
      description: Structured error; reason code determines safe user recovery. 202 never implies job completion.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    Money:
      type: object
      additionalProperties: false
      properties:
        amount:
          type: string
          pattern: ^(0|[1-9][0-9]*)\.[0-9]{6}$
          examples:
          - '2.400000'
        currency:
          type: string
          enum:
          - USD
      required:
      - amount
      - currency
      description: PROPOSED pilot accounting currency USD. Decimal strings, six fractional digits; never binary
        floats. Credits and subscription allocations are separate units, never implicitly summed with USD.
    ErrorDetail:
      type: object
      additionalProperties: false
      properties:
        entity_id: *id001
        reason_code:
          type: string
        field:
          type: string
      required:
      - reason_code
    ApiError:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          enum:
          - INVALID_REQUEST
          - UNAUTHENTICATED
          - PERMISSION_DENIED
          - NOT_FOUND
          - STALE_REVISION
          - SELECTION_EXPIRED
          - SELECTION_SCOPE_MISMATCH
          - IDEMPOTENCY_CONFLICT
          - ICP_NOT_APPROVED
          - ICP_STALE
          - POLICY_UNKNOWN
          - POLICY_BLOCKED
          - SUPPRESSED
          - BUYER_NOT_ACCEPTED
          - FIT_REVIEW_REQUIRED
          - QUOTE_EXPIRED
          - QUOTE_CHANGED
          - BUDGET_LIMIT
          - PROVIDER_UNAVAILABLE
          - PROVIDER_SUBMISSION_UNKNOWN
          - PROVIDER_CAPABILITY_BLOCKED
          - EVENT_CURSOR_EXPIRED
          - EVIDENCE_STALE
          - APPROVAL_STALE
          - DELIVERY_DISABLED
          - RATE_LIMITED
          - PARTIAL_FAILURE
          - INTERNAL_ERROR
        message:
          type: string
        request_id: *id001
        retryable: &id016
          type: boolean
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
        retry_after_seconds: *id005
      required:
      - code
      - message
      - request_id
      - retryable
      description: No contact values, access tokens, provider payloads or stack traces in errors. retryable does
        not authorize replaying an uncertain external paid operation.
      example:
        code: PROVIDER_SUBMISSION_UNKNOWN
        message: Provider acceptance is uncertain. Budget remains held pending reconciliation.
        request_id: 90000000-0000-4000-8000-000000000001
        retryable: false
    BaseEntity:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        workspace_id: *id001
        version: &id006
          type: integer
          minimum: 1
        created_at: *id004
        updated_at: *id004
        data_mode: &id008
          type: string
