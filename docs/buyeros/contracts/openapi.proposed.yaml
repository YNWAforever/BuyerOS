      - created_at
      - updated_at
      - data_mode
      - project_id
      - actor_id
      - status
      - purpose
      - request_hash
      - quote_hash
      - eligibility
      - eligible_buyer_ids
      - roles
      - provider_adapter_version
      - pricing_version
      - max_cost
      - expires_at
      - reservation_id
      - consumed_job_id
      description: PROPOSED quote. Creating/read/cancelling an unconsumed quote makes no provider call and reserves
        no money. quoted, expired and cancelled statuses have reservation_id=null and consumed_job_id=null. Atomic
        confirmation alone moves to consumed with both pointers present. Quote owner must equal confirmation actor;
        other operators/admins must create their own fresh quote. A consumed quote cannot be cancelled here; cancel
        its job. Zero-eligible quote cannot confirm. Price/profile/eligibility changes require re-quote.
      allOf:
      - if:
          properties:
            status:
              const: consumed
          required:
          - status
        then:
          properties:
            reservation_id:
              type: string
              format: uuid
            consumed_job_id:
              type: string
              format: uuid
        else:
          properties:
            reservation_id:
              type: 'null'
            consumed_job_id:
              type: 'null'
