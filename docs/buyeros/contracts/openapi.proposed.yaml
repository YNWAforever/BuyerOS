          type: string
          pattern: ^[0-9]+(\.[0-9]+)?$
        expires_at: *id004
        reservation_id:
          oneOf:
          - type: string
            format: uuid
          - type: 'null'
        consumed_job_id:
          oneOf:
          - type: string
            format: uuid
          - type: 'null'
      required:
      - id
      - workspace_id
