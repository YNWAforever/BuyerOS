[project]
name = "buyeros-api"
version = "0.1.0"
description = "BuyerOS domain API (BO-005 persistence spike)"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "sqlalchemy>=2.0,<2.1",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<4",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# NOTE (BO-005 spike): asyncpg and pyjwt[crypto] are intentionally omitted
# here; they are added when BO-004 (bearer identity) is implemented. The
# HTTP layer (BO-003/BO-007+, P9) uses fastapi/uvicorn.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["buyeros_api"]
